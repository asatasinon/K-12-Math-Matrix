[project]
name = "k12-math-matrix-api"
version = "0.1.0"
description = "FastAPI backend for K-12 Math Matrix."
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.15.2",
  "boto3>=1.37.37",
  "celery[redis]>=5.4.0",
  "fastapi>=0.115.12",
  "httpx>=0.28.1",
  "meilisearch>=0.34.1",
  "psycopg[binary]>=3.2.6",
  "pydantic-settings>=2.8.1",
  "sqlalchemy>=2.0.39",
  "structlog>=25.2.0",
  "uvicorn[standard]>=0.34.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.1.1",
  "ruff>=0.11.5"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
